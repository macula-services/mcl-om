# Structural lint, EUnit, and the Common Test suites.
#
# THE TEMPLATE SUITE IS THE REASON THIS EXISTS. mcl_om ships the scaffold
# every other service is generated from, and the previous templates drifted for
# months precisely because nothing ran them: they emitted a Quadlet unit nothing
# on the fleet uses, TODOs in place of callbacks, and an identity_spec claiming
# authority the generated service could not exercise. A guard nobody runs is not
# a guard. `rebar3 eunit` joined this job for the same reason, 2026-08-24: the
# mesh-wrappers pieces (mcl_om_capabilities/_pubsub/_content) shipped with real
# test coverage that nothing was running.
#
# IT RUNS BY ITSELF, on every pull request and every push to main. It used to
# be manual dispatch only, and that is how `rebar3 ct` sat red on main from
# before the macula 12 port until 0.26.1: a service with no seeds could not
# boot, and the one suite that starts a real pool through mcl_om could not
# pass. Nobody started the run, so nobody saw it. This workflow deploys
# nothing; a docs-only push skips it through paths-ignore.
#
# THE TOOLCHAIN IS THE IMAGE, pinned by its dated tag AND digest rather than
# :latest, so a rebuilt image cannot change this gate between two runs of the
# same commit.
# macula-io/macula-ci-images builds it (OTP 28.4.3, the team standard; an
# OpenSSL with ML-DSA, which every PQ node key needs; rebar3, Rust, cmake) and
# refuses to publish one whose crypto lacks mldsa87. This job used to build
# OpenSSL 3.6.4 and OTP 28.1 from source to get the same thing, and 28.1 was a
# version nobody chose. Move the tag deliberately.
#
# NOTHING THAT CAN CONTAIN A MODULE IS CACHED. A cached `_build' outlives the
# source it was compiled from, so a deleted module keeps being analysed (the
# station repo's ci.yml records that failure). Only the hex package cache is
# kept, and rebar.lock is gitignored, so every run resolves deps fresh.
#
# The live-mesh tests are NOT here: they cannot pass on GitHub-hosted
# runners (the fleet's stations are AAAA-only and the runners have no IPv6
# egress), so they run on manual dispatch only -- see live-mesh-tests.yml.

name: lint-and-test

on:
  pull_request:
    paths-ignore: ['**.md', 'guides/**', 'LICENSE']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'guides/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: lint-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint + eunit + ct (OTP 28.4.3)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/macula-io/macula-ci-otp:20260923-1347@sha256:b2260d084a3d3c5e0b74932c4ee052a0cadfddddb6587d5d2214873e6bb06330
    steps:
      - uses: actions/checkout@v4

      - name: Verify the toolchain is the one we think it is
        run: |
          openssl version
          rebar3 version
          erl -noshell -eval '
            Otp = string:trim(element(2, file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])))),
            Mldsa = lists:member(mldsa87, crypto:supports(public_keys)),
            io:format("OTP ~s, mldsa87 ~p~n", [Otp, Mldsa]),
            case {Otp, Mldsa} of
                {<<"28.4.3">>, true} -> halt(0);
                _                    -> halt(1)
            end.'

      - name: Cache the hex package cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rebar3/hex
          key: rebar3-hex-${{ hashFiles('rebar.config') }}
          restore-keys: rebar3-hex-

      - run: rebar3 lint
      - run: rebar3 eunit
      # mcl_service_template_SUITE shells out to `rebar3 new', so rebar3 must
      # be on PATH (the image installs it to /usr/local/bin).
      - run: rebar3 ct
      - run: rebar3 dialyzer

  # The scaffold's lint job, run in the image it names. The template suite runs
  # the same script, but mcl_om's own `check' job is itself a container with no
  # podman or docker inside, so there the suite skips that case by name. This
  # job, on the runner itself, is what keeps it from being a skip everywhere.
  template-lint-image:
    name: scaffold lint toolchain runs in its pinned image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: scripts/is_lint_toolchain_runnable.sh priv/templates/mcl_service/lint.yml
