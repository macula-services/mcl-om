# Structural lint, EUnit, and the Common Test suites.
#
# THE TEMPLATE SUITE IS THE REASON THIS EXISTS. mcl_om ships the scaffold
# every other service is generated from, and the previous templates drifted for
# months precisely because nothing ran them: they emitted a Quadlet unit nothing
# on the fleet uses, TODOs in place of callbacks, and an identity_spec claiming
# authority the generated service could not exercise. A guard nobody runs is not
# a guard. `rebar3 eunit` joined this job for the same reason, 2026-08-24: the
# mesh-wrappers pieces (mcl_om_capabilities/_pubsub/_content) shipped with real
# test coverage that nothing was running -- CI only ever called `rebar3 ct`, so
# a regression in any of it would have stayed green.
#
# THE 11.x PORT CHANGED THE RUNTIME REQUIREMENT. The PQ identity tests (and any
# pool connect) generate ML-DSA-87 node keys, and ML-DSA arrived in OpenSSL 3.5.
# The runners' system OpenSSL predates it (24.04 ships 3.0, and setup-beam's
# prebuilt OTP pins its own equally old libssl), so this job builds OpenSSL
# 3.6.4 and OTP 28.1 from source against it -- the same recipe the station
# repo's ci.yml uses, for the same reason. Never revert to a prebuilt OTP or
# to ubuntu-22.04 for speed: keygen then breaks, or the 22.04 pool throttles
# PQ crypto so hard individual eunit tests outrun even a 300s bound.
#
# cmake, a C++ toolchain, and the codec dev libs are still needed:
# barrel_docdb pulls in rocksdb, which builds its NIF from source via CMake,
# and rocksdb's own CMake silently disables Snappy/lz4/zstd/bz2 when their dev
# libs are missing, producing a NIF the runtime config cannot open. Install all
# four, not just the one that happened to be exercised.

name: lint-and-test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: lint + eunit + ct (OTP 28.1, PQ OpenSSL)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      LD_LIBRARY_PATH: /opt/openssl-pq/lib
    steps:
      - uses: actions/checkout@v4

      - name: Build a modern OpenSSL (ML-DSA) for the PQ crypto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential perl zlib1g-dev
          curl -fsSL https://github.com/openssl/openssl/releases/download/openssl-3.6.4/openssl-3.6.4.tar.gz -o /tmp/openssl.tar.gz
          tar -xzf /tmp/openssl.tar.gz -C /tmp
          cd /tmp/openssl-3.6.4
          ./Configure --prefix=/opt/openssl-pq -shared > /dev/null
          make -j4 > /dev/null
          sudo make install_sw > /dev/null

      # The RPATH baked in via LDFLAGS makes every OTP binary find
      # /opt/openssl-pq/lib WITHOUT LD_LIBRARY_PATH: the ct runner
      # spawns its test node in a way that did not carry the job env on
      # this repo's first run (eunit, in rebar3's own VM, was fine; the
      # spawned ct node saw the system libcrypto and crypto.so refused
      # to load). The RPATH makes the lookup correct in any spawn.
      - name: Build Erlang/OTP 28.1 from source against the PQ OpenSSL
        run: |
          sudo apt-get install -y -qq --no-install-recommends autoconf libncurses-dev m4
          curl -fsSL https://github.com/erlang/otp/releases/download/OTP-28.1/otp_src_28.1.tar.gz -o /tmp/otp.tar.gz
          tar -xzf /tmp/otp.tar.gz -C /tmp
          cd /tmp/otp_src_28.1
          LDFLAGS="-Wl,-rpath,/opt/openssl-pq/lib" \
            ./configure --prefix=/opt/otp-28.1 --with-ssl=/opt/openssl-pq \
              --without-javac --without-wx --without-odbc > /dev/null
          make -j4 > /dev/null
          sudo make install > /dev/null
          echo "/opt/otp-28.1/bin" >> "$GITHUB_PATH"

      - name: Verify the OTP crypto supports ML-DSA
        run: |
          /opt/otp-28.1/bin/erl -noshell -eval '
            case lists:member(mldsa87, crypto:supports(public_keys)) of
                true  -> io:format("mldsa87 supported~n"), halt(0);
                false -> io:format("mldsa87 MISSING: ~p~n", [crypto:supports(public_keys)]), halt(1)
            end.'

      - name: Install rebar3
        run: |
          curl -L -o rebar3 https://s3.amazonaws.com/rebar3/rebar3
          chmod +x rebar3
          sudo mv rebar3 /usr/local/bin/rebar3

      - name: Install rocksdb build deps
        run: |
          sudo apt-get install -y -qq --no-install-recommends cmake libsnappy-dev liblz4-dev libzstd-dev libbz2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - run: rebar3 lint
      - run: rebar3 eunit
      # mcl_service_template_SUITE shells out to `rebar3 new', so rebar3 must
      # be on PATH (installed above from the canonical S3 binary).
      - run: rebar3 ct

  # test_live/*.erl hit a real demo-fleet station over the network -- genuinely
  # valuable (they've caught three real bugs no unit test could have).
  # continue-on-error surfaces a failure (this job goes yellow, visible in the
  # run) without turning the check red.
  #
  # ⚠ The GitHub-hosted runner has no IPv6 egress, and the live fleet's
  # stations are AAAA-only, so `wait_healthy/2` in every test_live/*.erl
  # module times out before the QUIC connect can ever reach the station --
  # a platform limitation, not something this repo's code can route around.
  # Don't read a red live-mesh-tests run as "the station had a blip"; read
  # it as "expected on a GitHub-hosted runner, uninformative until this runs
  # somewhere with IPv6 egress." A self-hosted runner (this user's own boxes
  # are already IPv6-capable) or an IPv4 listener added station-side would
  # both fix it for real; neither is a workflow-file change.
  live-mesh-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    continue-on-error: true
    env:
      LD_LIBRARY_PATH: /opt/openssl-pq/lib
    steps:
      - uses: actions/checkout@v4

      - name: Build a modern OpenSSL (ML-DSA) for the PQ crypto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential perl zlib1g-dev
          curl -fsSL https://github.com/openssl/openssl/releases/download/openssl-3.6.4/openssl-3.6.4.tar.gz -o /tmp/openssl.tar.gz
          tar -xzf /tmp/openssl.tar.gz -C /tmp
          cd /tmp/openssl-3.6.4
          ./Configure --prefix=/opt/openssl-pq -shared > /dev/null
          make -j4 > /dev/null
          sudo make install_sw > /dev/null

      # The RPATH baked in via LDFLAGS makes every OTP binary find
      # /opt/openssl-pq/lib WITHOUT LD_LIBRARY_PATH: the ct runner
      # spawns its test node in a way that did not carry the job env on
      # this repo's first run (eunit, in rebar3's own VM, was fine; the
      # spawned ct node saw the system libcrypto and crypto.so refused
      # to load). The RPATH makes the lookup correct in any spawn.
      - name: Build Erlang/OTP 28.1 from source against the PQ OpenSSL
        run: |
          sudo apt-get install -y -qq --no-install-recommends autoconf libncurses-dev m4
          curl -fsSL https://github.com/erlang/otp/releases/download/OTP-28.1/otp_src_28.1.tar.gz -o /tmp/otp.tar.gz
          tar -xzf /tmp/otp.tar.gz -C /tmp
          cd /tmp/otp_src_28.1
          LDFLAGS="-Wl,-rpath,/opt/openssl-pq/lib" \
            ./configure --prefix=/opt/otp-28.1 --with-ssl=/opt/openssl-pq \
              --without-javac --without-wx --without-odbc > /dev/null
          make -j4 > /dev/null
          sudo make install > /dev/null
          echo "/opt/otp-28.1/bin" >> "$GITHUB_PATH"

      - name: Install rebar3
        run: |
          curl -L -o rebar3 https://s3.amazonaws.com/rebar3/rebar3
          chmod +x rebar3
          sudo mv rebar3 /usr/local/bin/rebar3

      - name: Install rocksdb build deps
        run: |
          sudo apt-get install -y -qq --no-install-recommends cmake libsnappy-dev liblz4-dev libzstd-dev libbz2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - run: rebar3 as live_test eunit --dir test_live
