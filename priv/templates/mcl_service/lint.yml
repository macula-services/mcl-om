{{=<% %>=}}# Structural lint, unit tests and dialyzer, in the SAME digest-pinned image
# the Containerfile's builder stage uses, so CI tests the toolchain that
# ships: OTP 28.4.3 with ML-DSA, rebar3, Rust (macula's NIFs always build
# from source) and a C toolchain, all from the image, none installed here.
#
# build-push.yml calls this workflow (workflow_call) on the commit it builds
# and pushes no image until it is green: before that the two ran side by side,
# and a push with red tests still published (mcl-om#34).

name: lint-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  check:
    runs-on: <%runs_on%>
    container:
      # ⚠ THE SAME IMAGE AS THE Containerfile's builder, by digest. The service
      # tests guard that the two agree and that the step below refuses
      # anything but 28.4.3.
      image: <%builder_image%>
    steps:
      # BEFORE checkout, so an image missing git (checkout would fall back to
      # the REST API, with no real clone and no tags) or any other tool the
      # build needs fails here, naming it, rather than a later step failing
      # on its absence. mcl_om's template suite runs the block between the
      # markers in this image (scripts/is_lint_toolchain_runnable.sh).
      - name: Verify the toolchain is the one we think it is
        run: |
          # toolchain-begin
          git --version
          openssl version
          rebar3 version
          rustc --version
          cargo --version
          erl -noshell -eval '
            Otp = string:trim(element(2, file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])))),
            Mldsa = lists:member(mldsa87, crypto:supports(public_keys)),
            io:format("OTP ~s, mldsa87 ~p~n", [Otp, Mldsa]),
            case {Otp, Mldsa} of
                {<<"28.4.3">>, true} -> halt(0);
                _                    -> halt(1)
            end.'
          # toolchain-end
      - uses: actions/checkout@v4
      - run: rebar3 lint
      - run: rebar3 eunit
      - run: rebar3 dialyzer
      # THE RELEASE THE CONTAINERFILE BUILDS, assembled here on every change.
      # relx refuses what lint, eunit and dialyzer never look at -- two apps
      # registering one name stopped a service's first tagged image while every
      # pull request was green. The command is the Containerfile's own, and
      # mcl_om's template suite fails when the two disagree.
      - run: rebar3 as prod release

  # scripts/promote_latest.sh, the one step that moves :latest, is only ever run
  # by a release. This runs it on every change, against a registry of its own,
  # so a broken promotion shows here and not on a tag.
  promote-latest-copies-the-digest:
    runs-on: <%runs_on%>
    services:
      registry:
        image: docker.io/library/registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4
      - run: scripts/promote_latest_test.sh
        env:
          REGISTRY: localhost:5000

<%#attest%>
  # A dependency the service ships with a published advisory fails its CI, and
  # build-push.yml waits on this workflow before it pushes an image, so the
  # image is not published either (macula-codebase-checks#11). The shared
  # workflow is pinned by full commit; its scan reads the rebar.lock this
  # build resolves, since a rebar3 project commits none.
  #
  # .github/advisories-waivers.txt starts with no rows, so this goes red on the
  # first advisory the service inherits and stays red until the advisory is
  # fixed or a dated, owned row is added. That is the point: the gate has no
  # baselines. A row is five fields, 'advisory | package | why | owner |
  # expires YYYY-MM-DD', and the file's header says what each one is for.
  #
  # INSIDE THE HOUSE BLOCK because that workflow is macula-ci-images', the same
  # reason the release guard and the attest call in build-push.yml are: a
  # scaffold for another org carries no macula-io path at all.
  advisories:
    name: Dependency advisories
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/dependency-advisories.yml@83a76a358456bf2f7d6c919ad5e8fe7fd2162ce3
    with:
      ecosystem: erlang
<%/attest%>
