{{=<% %>=}}# Build the OCI image for <%repo%> and push to the registry.
#
# THREE CHANNELS, AND ONLY A RELEASE MOVES THE ONE PEOPLE PULL.
#
#   push to main : publishes :main and :<sha>   <- the tip, for trying; nothing follows it
#   push of v*   : publishes :<version>        <- the rollback archive
#   the newest release (a plain vX.Y.Z): :latest, as a carbon copy of that tag's digest <- what a compose file runs
#
# `:latest' is what anyone outside the fleet pulls and what
# deploy/docker-compose.yml runs, so it names a release and never an unreviewed
# tip of main. scripts/image_tags.sh decides the first two from the ref, and
# scripts/promote_latest.sh moves :latest only to a digest that was just built
# (and, in the house, after it was signed), only when it is the newest RELEASE
# -- an rc is a rehearsal and never counts -- so a patch cut after a newer minor
# cannot move it backwards.
#
# NO PATH FILTER, ON PURPOSE. A docs-only push would rebuild, but
# `paths-ignore' cannot be trusted with that: on the push that CREATES a branch
# GitHub evaluates it on the head commit alone, so a first push ending in a
# README edit silently built no image. scripts/is_image_push.sh decides from
# the pushed range instead, and builds whenever it cannot tell. If an image is
# ever missing anyway, run this workflow by hand.
#
# NOTE ON PUSHING THIS FILE. An HTTPS push that creates or updates anything under
# .github/workflows/ needs a token carrying the `workflow' scope, and the error
# names the FILE rather than the missing scope. Use an SSH remote and the problem
# does not arise.

name: build-and-push

on:
  push:
    branches: [main]
    tags:     ['v*']
  workflow_dispatch:

# ONE IMAGE BUILD IN FLIGHT PER REF. Every push to main builds and pushes
# :latest; without this, three quick commits run three builds that finish in
# whatever order the runners please, and :latest ends up being whichever
# finished LAST, not whichever was pushed last -- watchtower then rolls the
# fleet onto an older commit and flaps. A sibling service hit exactly that live.
# A newer push to a branch or tag QUEUES behind the run in flight, never
# cancels it: a cancelled run could already have pushed its image and not yet
# signed it (mcl-om#9). Pull-request runs push nothing, so they still cancel.
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # NO IMAGE WHILE ITS OWN TESTS ARE RED. lint.yml, called on the commit this
  # run builds, and the build waits on it (mcl-om#34).
  test:
    uses: ./.github/workflows/lint.yml
<%#c4%>

  # THE SERVICE'S C4 MODEL: what it talks to, and what it is made of
  # (macula-codebase-checks#10). Three diagrams in assets/, a context, a
  # containers and a component one, each shown by README.md or
  # architecture/README.md, and this
  # job red until they are there. architecture/README.md says what goes in them,
  # and the scaffold does not draw them, because a diagram generated from a
  # template is a placeholder with a nicer shape.
  #
  # IT IS NOT IN THE IMAGE'S PATH, ON PURPOSE: nothing `needs' it and it needs
  # nothing, so a service publishes its first image while it still owes its
  # readers a model. Red here is the report, not a deploy block. It is at this
  # level rather than in lint.yml because build-and-push's test job IS lint.yml,
  # and every job in a called workflow is part of what the image waits for.
  #
  # The check is the house's and is pinned by full commit sha, like the release
  # guard and the attest call below.
  c4-model:
    permissions:
      contents: read
    uses: <%c4_gate%>
<%/c4%>
<%#attest%>

  # REFUSED BEFORE ANYTHING IS PUSHED: a v* tag off the default branch (or off its
  # line's release-<major>.<minor> branch), or whose version is not the one this
  # repository publishes, stops here, so a refused tag leaves no image on the
  # registry. Any other ref passes. attest-image checks the same again before it
  # signs. Pinned by full commit sha, as the attest call is.
  guard:
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/release-guard.yml@b4c41abb404c32215a2823b7f19ac65b732e1dfe
    with:
      runs-on: '<%runs_on%>'
<%/attest%>

  build-and-push:
<%#attest%>
    needs: [guard, test]
<%/attest%>
<%^attest%>
    needs: test
<%/attest%>
    runs-on: <%runs_on%>
    permissions:
      contents: read
      packages: write
    # The digest the push produced: promote-latest puts it under :latest, and
    # in the house the signing job signs it.
    outputs:
      digest: ${{ steps.digest.outputs.digest }}

    steps:
      # The whole history, so the gate below can diff the pushed range.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this push need an image?
        id: gate
        run: scripts/is_image_push.sh "${{ github.event.before }}" "${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # PLAIN `docker' CLI STEPS, NO docker/* ACTIONS, so the job runs on a
      # GitHub-hosted runner (docker) and on a runner whose `docker' is
      # a shim for podman alike. docker/build-push-action needs Docker's buildx,
      # which podman is not.
      #
      # THE LOGIN GOES TO THIS JOB'S OWN FILES, DOCKER_CONFIG for docker and
      # REGISTRY_AUTH_FILE for podman, both under $RUNNER_TEMP. Runners on one
      # box can share one podman and its default auth file, and a token written
      # there is readable by, and overwritten by, the other runners' jobs.
      - name: Log in to the registry
        if: steps.gate.outputs.build == 'true'
        id: login
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/auth.json" >> "$GITHUB_ENV"
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config" REGISTRY_AUTH_FILE="$RUNNER_TEMP/auth.json"
          echo "$TOKEN" | docker login <%registry%> -u "${{ github.actor }}" --password-stdin

      # THE COMPLETE TAG LIST COMES FROM scripts/image_tags.sh, so one case
      # governs all of it: a v* tag publishes that version, main publishes
      # :main and :<sha>, and any other ref is refused, naming it. None of them
      # is :latest; promote-latest moves that, below.
      - name: Set tags
        if: steps.gate.outputs.build == 'true'
        id: tag
        run: scripts/image_tags.sh >> "$GITHUB_OUTPUT"

      # BUILT UNDER A TAG UNIQUE TO THIS RUN, then tagged for the registry and
      # pushed. A shared image store sees every runner's builds, and the run id
      # keeps two of them from racing on one local name. REVISION is the commit
      # the image was built from, readable from the image itself.
      #
      # BUILDAH_FORMAT: podman builds OCI by default, and OCI has no
      # HEALTHCHECK, so the image would silently lose the one the Containerfile
      # declares. docker ignores the variable.
      - name: Build and push
        if: steps.gate.outputs.build == 'true'
        id: build
        env:
          BUILDAH_FORMAT: docker
          LOCAL: <%repo%>:ci-${{ github.run_id }}-${{ github.run_attempt }}
          TAGS: ${{ steps.tag.outputs.tags }}
        run: |
          docker build --file Containerfile --build-arg REVISION=${{ github.sha }} --tag "$LOCAL" .
          for tag in $TAGS; do
              docker tag "$LOCAL" "$tag"
              docker push "$tag"
          done

      # THE DIGEST THE PUSH PRODUCED, read back from the registry by the tag
      # just pushed: the steps above are plain docker CLI (they must run on a
      # podman shim too), so no action reports it. The concurrency group keeps
      # another build of this ref from moving the tag in between.
      # promote-latest puts this digest under :latest, and in the house the
      # signing job signs it.
      - name: Resolve the pushed digest
        if: steps.gate.outputs.build == 'true'
        id: digest
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ steps.tag.outputs.tags }}
        run: |
          tag="${TAGS%% *}"
          digest=$(curl -fsSI -H "Authorization: Bearer $(printf %s "$TOKEN" | base64 -w0)" \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://<%registry%>/v2/<%org%>/<%repo%>/manifests/${tag##*:}" \
            | tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p')
          case "$digest" in
            sha256:*) echo "digest=$digest" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::the registry named no digest for $tag"; exit 1 ;;
          esac

      # BY NAME, NEVER BY WILDCARD: on a shared image store, a wildcard removal
      # takes other jobs' images mid-run. Keyed on the LOGIN, so the credentials go
      # even when a step between login and build failed; an image that was
      # never built is skipped. A red job here after a green push means the
      # image is published and only this cleanup failed.
      - name: Remove this run's images and credentials
        if: always() && steps.login.outcome != 'skipped'
        env:
          LOCAL: <%repo%>:ci-${{ github.run_id }}-${{ github.run_attempt }}
          TAGS: ${{ steps.tag.outputs.tags }}
        run: |
          for image in "$LOCAL" $TAGS; do
              if docker image inspect "$image" >/dev/null 2>&1; then docker rmi "$image"; fi
          done
          rm -rf "$RUNNER_TEMP/docker-config" "$RUNNER_TEMP/auth.json"
<%#attest%>

  # SIGNED BY DIGEST, SBOM AND PROVENANCE ATTESTED, keyless, so a box can refuse any
  # digest of this image that did not come from this workflow on a commit of this
  # repository (a box that verifies signatures refuses one before it runs it). Pinned
  # by full commit sha: the signing identity is that file at that ref. Runs on the
  # build's own runner. See macula-ci-images' README.
  attest:
    needs: build-and-push
    if: needs.build-and-push.outputs.digest != ''
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: macula-io/macula-ci-images/.github/workflows/attest-image.yml@b4c41abb404c32215a2823b7f19ac65b732e1dfe
    with:
      image: <%registry%>/<%org%>/<%repo%>
      digest: ${{ needs.build-and-push.outputs.digest }}
      runs-on: '<%runs_on%>'
<%/attest%>

  # :LATEST IS A RELEASE, NEVER A TIP OF MAIN. It moves as a carbon copy of the
  # digest a v* tag just pushed, and only when that tag is the newest RELEASE
  # -- a plain vX.Y.Z, so an rc is a rehearsal and never moves it: two tags
  # build in parallel, and a patch cut after a newer minor must not drag
  # :latest backwards. Nothing is re-serialised here, so the bytes under
  # :latest are the bytes that were built and, in the house, signed.
  #
  # It waits on the signing job as well, where there is one: a box that
  # verifies signatures must never find an unsigned digest under the tag it
  # pulls.
  promote-latest:
    needs: <%#attest%>[build-and-push, attest]<%/attest%><%^attest%>build-and-push<%/attest%>
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-and-push.outputs.digest != ''
    runs-on: <%runs_on%>
    concurrency:
      group: promote-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      # Every tag, so the newest one is known at the moment of promotion.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is this the newest release?
        id: newest
        run: |
          git fetch --force --tags origin
          scripts/is_newest_release.sh "${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Point :latest at the pushed digest
        if: steps.newest.outputs.promote == 'true'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/promote_latest.sh <%registry%>/<%org%>/<%repo%> "${{ needs.build-and-push.outputs.digest }}"
